<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOGUE OS | 深夜套房終端機</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050508;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Container keeping aspect ratio of room image */
        #app-container {
            position: relative;
            aspect-ratio: 9 / 16;
            width: 100vw;
            max-width: 56.25vh;
            /* 100vh * (9 / 16) */
            height: auto;
            max-height: 100vh;
            background-color: #050508;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.15);
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid #1a1a2e;
            margin: 0 auto;
        }

        /* Background video styling */
        .background-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        /* Ambient scanline overlay for Cyberpunk feel */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
            opacity: 0.6;
        }

        /* Header Cyberpunk HUD */
        .hud-header {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }

        .hud-title {
            font-size: 14px;
            letter-spacing: 2px;
            color: #f2c94c;
            text-shadow: 0 0 10px rgba(242, 201, 76, 0.8);
            background: rgba(10, 10, 15, 0.8);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid rgba(242, 201, 76, 0.4);
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.3s ease;
            animation: pulse-hud-yellow 3s infinite ease-in-out;
        }

        .hud-title:active {
            animation: none !important;
            box-shadow: 0 0 25px #f2c94c, inset 0 0 20px #f2c94c;
            border: 2px solid #f2c94c;
            background: rgba(242, 201, 76, 0.25);
        }

        @keyframes pulse-hud-yellow {

            0%,
            100% {
                box-shadow: 0 0 8px rgba(242, 201, 76, 0.15), inset 0 0 6px rgba(242, 201, 76, 0.1);
                border: 1px solid rgba(242, 201, 76, 0.2);
            }

            50% {
                box-shadow: 0 0 18px rgba(242, 201, 76, 0.35), inset 0 0 14px rgba(242, 201, 76, 0.25);
                border: 1.5px solid rgba(242, 201, 76, 0.4);
            }
        }

        @media (hover: hover) {
            .hud-title:hover {
                animation: none !important;
                box-shadow: 0 0 25px #f2c94c, inset 0 0 20px #f2c94c;
                border: 2px solid #f2c94c;
                background: rgba(242, 201, 76, 0.15);
            }
        }

        .hud-status {
            font-size: 12px;
            color: #00f0ff;
            background: rgba(10, 10, 15, 0.8);
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid rgba(0, 240, 255, 0.4);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
        }

        /* Interactive Hotspots */
        .interactive-zone {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* Breathing Keyframes */
        @keyframes pulse-microwave {

            0%,
            100% {
                box-shadow: 0 0 8px rgba(0, 240, 255, 0.15), inset 0 0 6px rgba(0, 240, 255, 0.1);
                border: 1px solid rgba(0, 240, 255, 0.2);
            }

            50% {
                box-shadow: 0 0 16px rgba(0, 240, 255, 0.35), inset 0 0 12px rgba(0, 240, 255, 0.25);
                border: 1.5px solid rgba(0, 240, 255, 0.4);
            }
        }

        @keyframes pulse-electric {

            0%,
            100% {
                box-shadow: 0 0 8px rgba(255, 0, 85, 0.15), inset 0 0 6px rgba(255, 0, 85, 0.1);
                border: 1px solid rgba(255, 0, 85, 0.2);
            }

            50% {
                box-shadow: 0 0 16px rgba(255, 0, 85, 0.35), inset 0 0 12px rgba(255, 0, 85, 0.25);
                border: 1.5px solid rgba(255, 0, 85, 0.4);
            }
        }

        @keyframes pulse-door {

            0%,
            100% {
                box-shadow: 0 0 8px rgba(189, 0, 255, 0.15), inset 0 0 6px rgba(189, 0, 255, 0.1);
                border: 1px solid rgba(189, 0, 255, 0.2);
            }

            50% {
                box-shadow: 0 0 18px rgba(189, 0, 255, 0.35), inset 0 0 14px rgba(189, 0, 255, 0.25);
                border: 1.5px solid rgba(189, 0, 255, 0.4);
            }
        }

        @keyframes pulse-switch {

            0%,
            100% {
                box-shadow: 0 0 8px rgba(224, 224, 224, 0.15), inset 0 0 6px rgba(224, 224, 224, 0.1);
                border: 1px solid rgba(224, 224, 224, 0.2);
            }

            50% {
                box-shadow: 0 0 16px rgba(224, 224, 224, 0.35), inset 0 0 12px rgba(224, 224, 224, 0.25);
                border: 1.5px solid rgba(224, 224, 224, 0.4);
            }
        }

        /* Hotspot 1: Microwave (Vibe Cooking) */
        .zone-microwave {
            bottom: 0%;
            left: 0%;
            width: 33%;
            height: 33%;
            border-radius: 12px;
            animation: pulse-microwave 3s infinite ease-in-out;
        }

        /* Hotspot 2: Electric Box (Version Log) */
        .zone-electric {
            top: 38%;
            left: 14.5%;
            width: 13%;
            height: 8%;
            border-radius: 6px;
            animation: pulse-electric 3s infinite ease-in-out 0.7s;
        }

        /* Hotspot 3: Wooden Door (Inspiration) */
        .zone-door {
            top: 35%;
            left: 41%;
            width: 30%;
            height: 38%;
            border-radius: 8px;
            animation: pulse-door 3s infinite ease-in-out 1.4s;
        }

        /* Hotspot 4: Exhaust Fan (Contact & Follow) */
        .zone-switch {
            top: 28%;
            left: 54%;
            width: 14%;
            height: 7%;
            border-radius: 6px;
            animation: pulse-switch 3s infinite ease-in-out 2.1s;
        }

        /* Active/Touch Instant Feedback (Light up 100%) */
        .interactive-zone:active {
            animation: none !important;
            backdrop-filter: blur(1px);
        }

        .zone-microwave:active {
            box-shadow: 0 0 20px #00f0ff, inset 0 0 15px #00f0ff;
            border: 2px solid #00f0ff;
            background: rgba(0, 240, 255, 0.25);
        }

        .zone-electric:active {
            box-shadow: 0 0 20px #ff0055, inset 0 0 15px #ff0055;
            border: 2px solid #ff0055;
            background: rgba(255, 0, 85, 0.25);
        }

        .zone-door:active {
            box-shadow: 0 0 25px #bd00ff, inset 0 0 20px #bd00ff;
            border: 2px solid #bd00ff;
            background: rgba(189, 0, 255, 0.25);
        }

        .zone-switch:active {
            box-shadow: 0 0 20px #e0e0e0, inset 0 0 15px #e0e0e0;
            border: 2px solid #e0e0e0;
            background: rgba(224, 224, 224, 0.25);
        }

        /* Hover Glowing Neon Outline & Shadow Effects for Desktop */
        @media (hover: hover) {
            .interactive-zone:hover {
                animation: none !important;
                box-shadow: 0 0 20px #00f0ff, inset 0 0 15px #00f0ff;
                border: 2px solid #00f0ff;
                background: rgba(0, 240, 255, 0.15);
                backdrop-filter: blur(1px);
            }

            .zone-electric:hover {
                animation: none !important;
                box-shadow: 0 0 20px #ff0055, inset 0 0 15px #ff0055;
                border: 2px solid #ff0055;
                background: rgba(255, 0, 85, 0.15);
            }

            .zone-door:hover {
                animation: none !important;
                box-shadow: 0 0 25px #bd00ff, inset 0 0 20px #bd00ff;
                border: 2px solid #bd00ff;
                background: rgba(189, 0, 255, 0.15);
            }

            .zone-switch:hover {
                animation: none !important;
                box-shadow: 0 0 20px #e0e0e0, inset 0 0 15px #e0e0e0;
                border: 2px solid #e0e0e0;
                background: rgba(224, 224, 224, 0.15);
            }

            /* Hover Triggering Label */
            .interactive-zone:hover .floating-label {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            .zone-switch:hover .label-switch {
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        /* Floating Tooltip Label */
        .floating-label {
            position: absolute;
            opacity: 0;
            transform: translateY(10px) scale(0.9);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            white-space: nowrap;
            font-weight: bold;
            letter-spacing: 1.5px;
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
            z-index: 30;
            font-size: 14px;
        }

        /* Label Colors */
        .label-microwave {
            color: #00f0ff;
            background: rgba(5, 15, 25, 0.9);
            border: 1px solid #00f0ff;
            text-shadow: 0 0 8px #00f0ff;
            top: 15%;
        }

        .label-electric {
            color: #ff0055;
            background: rgba(25, 5, 15, 0.9);
            border: 1px solid #ff0055;
            text-shadow: 0 0 8px #ff0055;
            top: -50%;
        }

        .label-door {
            color: #bd00ff;
            background: rgba(20, 5, 25, 0.9);
            border: 1px solid #bd00ff;
            text-shadow: 0 0 8px #bd00ff;
            top: 45%;
        }

        .label-switch {
            color: #e0e0e0;
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid #e0e0e0;
            text-shadow: 0 0 8px #e0e0e0;
            top: -65%;
            left: 50%;
            transform: translateX(-50%) translateY(10px) scale(0.9);
        }

        /* Modal Popup System */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(8px);
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #0d0f17;
            border: 1px solid #00f0ff;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 450px;
            max-height: 80%;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #aaa;
            cursor: pointer;
            font-size: 18px;
            z-index: 55;
        }

        .modal-title {
            color: #f2c94c;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 1px solid #222;
            padding-bottom: 8px;
            flex-shrink: 0;
        }

        .modal-body {
            font-size: 14px;
            line-height: 1.6;
            color: #ccc;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            /* Firefox */
            -ms-overflow-style: none;
            /* IE and Edge */
            cursor: grab;
            /* Desktop grab cursor */
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .modal-body::-webkit-scrollbar {
            display: none;
        }

        /* 3D Card Flip for Hotspot 2 */
        .card-container {
            position: absolute;
            width: 34.1%;
            height: 15.1%;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-container.is-flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 8px;
            overflow: hidden;
            box-sizing: border-box;
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            -webkit-user-drag: none;
            user-select: none;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #141724;
            border: 1px solid rgba(255, 0, 85, 0.5);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f2c94c;
            /* Neon gold/yellow text */
            text-shadow: 0 0 8px rgba(242, 201, 76, 0.6);
            font-size: 13px;
            font-weight: bold;
            padding: 8px;
            text-align: center;
            line-height: 1.4;
            user-select: none;
        }

        /* Gemini Star styling for Hotspot 2 */
        .gemini-star {
            position: absolute;
            top: 98%;
            left: 91.5%;
            transform: translate(-50%, -50%) rotate(0deg);
            color: #f2c94c;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(242, 201, 76, 0.9);
            pointer-events: none;
            z-index: 10;
        }

        .gemini-star.is-orbiting {
            animation: star-orbit 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes star-orbit {
            0% {
                transform: translate(-50%, -50%) rotate(0deg) translate(0px) rotate(0deg) scale(1);
            }

            50% {
                /* Peak of the orbit: translate outwards, glow bright white/gold, scale up */
                transform: translate(-50%, -50%) rotate(180deg) translate(22px) rotate(-180deg) scale(1.25);
                color: #fff;
                text-shadow: 0 0 15px rgba(255, 255, 255, 1), 0 0 25px rgba(242, 201, 76, 0.8);
            }

            100% {
                /* Back to center */
                transform: translate(-50%, -50%) rotate(360deg) translate(0px) rotate(-360deg) scale(1);
                color: #f2c94c;
                text-shadow: 0 0 10px rgba(242, 201, 76, 0.9);
            }
        }

        /* Homepage Star styling */
        .homepage-star {
            position: absolute;
            top: 86.5%;
            left: 96.5%;
            transform: translate(-50%, -50%) rotate(0deg);
            pointer-events: none;
            z-index: 10;
        }

        .homepage-star.is-orbiting {
            animation: star-orbit-movement 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes star-orbit-movement {
            0% {
                transform: translate(-50%, -50%) rotate(0deg) translate(0px) rotate(0deg) scale(1);
            }

            50% {
                /* Peak of the orbit: translate outwards, scale up */
                transform: translate(-50%, -50%) rotate(180deg) translate(22px) rotate(-180deg) scale(1.25);
            }

            100% {
                /* Back to center */
                transform: translate(-50%, -50%) rotate(360deg) translate(0px) rotate(-360deg) scale(1);
            }
        }

        .homepage-star-inner {
            display: inline-block;
            font-size: 24px;
            animation: homepage-star-color-cycle 12s infinite ease-in-out;
        }

        @keyframes homepage-star-color-cycle {
            0%, 100% {
                color: #f2c94c; /* Yellow */
                text-shadow: 0 0 10px rgba(242, 201, 76, 0.9);
            }

            25% {
                color: #ffffff; /* White */
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
            }

            50% {
                color: #ff0055; /* Red */
                text-shadow: 0 0 10px rgba(255, 0, 85, 0.9);
            }

            75% {
                color: #00f0ff; /* Blue */
                text-shadow: 0 0 10px rgba(0, 240, 255, 0.9);
            }
        }

        /* Contact list layout */
        .contact-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 10px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 12px 16px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .contact-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.05), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .contact-item:hover::before {
            transform: translateX(100%);
        }

        .contact-item:hover {
            transform: translateY(-2px);
        }

        /* Specific hover effects for platforms */
        .contact-item-ig:hover {
            background: linear-gradient(45deg, rgba(249, 206, 52, 0.05), rgba(238, 42, 123, 0.05), rgba(98, 40, 215, 0.05));
            border-color: rgba(224, 53, 110, 0.5);
            box-shadow: 0 0 15px rgba(224, 53, 110, 0.25);
        }

        .contact-item-email:hover {
            background: rgba(234, 67, 53, 0.05);
            border-color: rgba(234, 67, 53, 0.5);
            box-shadow: 0 0 15px rgba(234, 67, 53, 0.25);
        }

        .contact-item-yt:hover {
            background: rgba(255, 0, 0, 0.05);
            border-color: rgba(255, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.25);
        }

        .contact-icon-wrapper {
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 6px;
            padding: 6px;
            margin-right: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        .contact-item:hover .contact-icon-wrapper {
            transform: scale(1.08) rotate(3deg);
        }

        .contact-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .contact-label {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
            transition: color 0.3s ease;
        }

        .contact-item-ig:hover .contact-label {
            color: #e1306c;
        }

        .contact-item-email:hover .contact-label {
            color: #ea4335;
        }

        .contact-item-yt:hover .contact-label {
            color: #ff0000;
        }

        .contact-value {
            font-size: 15px;
            font-weight: 500;
            color: #e0e0e0;
            transition: color 0.3s ease;
        }

        .contact-item:hover .contact-value {
            color: #fff;
        }

        .contact-arrow {
            margin-left: auto;
            color: #444;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .contact-item:hover .contact-arrow {
            color: #fff;
            transform: translateX(4px);
        }

        /* Red vibration/shake animation for YouTube Under Construction */
        @keyframes shake-red {

            0%,
            100% {
                transform: translateX(0);
            }

            20%,
            60% {
                transform: translateX(-6px);
            }

            40%,
            80% {
                transform: translateX(6px);
            }
        }

        .contact-item-yt.under-construction {
            animation: shake-red 0.4s ease-in-out;
            background: rgba(255, 0, 0, 0.15) !important;
            border-color: #ff0000 !important;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6) !important;
        }

        .contact-item-yt.under-construction .contact-label {
            color: #ff0000 !important;
        }

        .contact-item-yt.under-construction .contact-value {
            color: #ff3b30 !important;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.8) !important;
        }
    </style>
</head>

<body>

    <div id="app-container">
        <!-- Background Video -->
        <video class="background-video" autoplay loop muted playsinline poster="3271.jpg">
            <source src="3271.mp4" type="video/mp4">
        </video>
        <div class="scanline"></div>

        <!-- HUD Header -->
        <div class="hud-header">
            <div class="hud-title"
                onclick="openModal('系統修繕日誌', '● [2026.03] v0.1 ALPHA INIT<br>&nbsp;&nbsp;- 墨古（Mogue）深夜套房系統正式初始化。<br>&nbsp;&nbsp;- 載入「外送員 ✕ 微波爐實驗室」。<br><br>● [2026.06] v0.5 MONETIZATION PATCH<br>&nbsp;&nbsp;- 解鎖商業合作。<br><br>● [2026.07] v0.8 AFFILIATE SHOPEE<br>&nbsp;&nbsp;- 啟動蝦皮分潤計畫。<br><br>● [2026.08] v0.9 E-BOOKS<br>&nbsp;&nbsp;- 撰寫vibe cooking。<br><br>● [2026.09] v1.0 MOGUE OS RELEASE<br>&nbsp;&nbsp;- 上線互動式深夜套房終端首頁。')">
                墨古 v1.0</div>
        </div>

        <!-- Hotspot 1: Microwave -->
        <div class="interactive-zone zone-microwave"
            onclick="openModal('Vibe Cooking 微波科技料理', '這裡存放墨古最新的深夜微波降維食譜：<br><br>• 熱果乾優格碗 (20s)<br>• 貴妃醉雞 (6.5m)<br>• 小卷義大利麵 (28s完看爆款)<br><br><a href='#' style='color:#00f0ff'>👉 免費瀏覽完整食譜電子書</a>')">
            <div class="floating-label label-microwave">⚡ VIBE COOKING</div>
        </div>

        <!-- Hotspot 2: Gear Mod -->
        <div class="interactive-zone zone-electric"
            onclick="openModal('裝備模組', '<div style=\'position: relative; width: 100%; display: inline-block;\'><img src=\'2000.png\' style=\'width: 100%; height: auto; border-radius: 6px; display: block; -webkit-user-drag: none; user-select: none;\' draggable=\'false\' alt=\'裝備模組\'><div class=\'card-container\' onclick=\'window.open(&quot;https://s.shopee.tw/AKZPy8wusY&quot;, &quot;_blank&quot;)\' style=\'top: 57.0%; left: 11.4%;\'><div class=\'card-inner\'><div class=\'card-front\'><img src=\'蝦皮分潤/1.jpg\' draggable=\'false\'></div><div class=\'card-back\'>馬鈴薯麵</div></div></div><div class=\'card-container\' onclick=\'window.open(&quot;https://s.shopee.tw/1qarqYXLeb&quot;, &quot;_blank&quot;)\' style=\'top: 57.0%; left: 54.8%;\'><div class=\'card-inner\'><div class=\'card-front\'><img src=\'蝦皮分潤/2.jpg\' draggable=\'false\'></div><div class=\'card-back\'>金鳥-防蚊掛片</div></div></div><div class=\'card-container\' onclick=\'window.open(&quot;https://s.shopee.tw/AKZPy8wusY&quot;, &quot;_blank&quot;)\' style=\'top: 78.5%; left: 11.4%;\'><div class=\'card-inner\'><div class=\'card-front\'><img src=\'蝦皮分潤/3.jpg\' draggable=\'false\'></div><div class=\'card-back\'>馬鈴薯麵</div></div></div><div class=\'card-container\' onclick=\'window.open(&quot;https://s.shopee.tw/1qarqYXLeb&quot;, &quot;_blank&quot;)\' style=\'top: 78.5%; left: 54.8%;\'><div class=\'card-inner\'><div class=\'card-front\'><img src=\'蝦皮分潤/4.jpg\' draggable=\'false\'></div><div class=\'card-back\'>金鳥-防蚊掛片</div></div></div><div class=\'gemini-star\'>✦</div></div>', '#ff0055')">
            <div class="floating-label label-electric">⚔️ 裝備模組</div>
        </div>

        <!-- Hotspot 3: Wooden Door -->
        <div class="interactive-zone zone-door"
            onclick="openModal('找尋靈感 | MOGUE Selection', '探索深夜套房的廚具裝備與創作靈感源泉：<br><br>• 墨古嚴選微波煎烤盤<br>• 伊頓台灣小農果乾<br>• 樂米脆熟化米餅<br><br><a href='#' style='color:#f2c94c'>👉 查看蝦皮推薦清單</a>')">
            <div class="floating-label label-door">🔑 找尋靈感</div>
        </div>

        <!-- Hotspot 4: Exhaust Fan -->
        <div class="interactive-zone zone-switch" onclick="openContactModal()">
            <div class="floating-label label-switch">🔮 聯絡與追蹤</div>
        </div>

        <!-- Homepage Star -->
        <div class="homepage-star gemini-star">
            <div class="homepage-star-inner">✦</div>
        </div>

        <!-- Modal Popup -->
        <div class="modal-overlay" id="modal" onclick="closeModal()">
            <div class="modal-box" id="modalBox" onclick="event.stopPropagation()">
                <div class="modal-close" onclick="closeModal()">✕</div>
                <div class="modal-title" id="modalTitle">Title</div>
                <div class="modal-body" id="modalBody">Body content</div>
            </div>
        </div>
    </div>

    <script>
        function openModal(title, body, themeColor) {
            document.getElementById('modalTitle').innerHTML = title;
            document.getElementById('modalBody').innerHTML = body;

            const modalBox = document.getElementById('modalBox');
            if (themeColor) {
                modalBox.style.borderColor = themeColor;
                modalBox.style.boxShadow = `0 0 30px ${themeColor}4d`; // 4d is ~30% opacity in hex
            } else {
                modalBox.style.borderColor = '#00f0ff';
                modalBox.style.boxShadow = '0 0 30px rgba(0, 240, 255, 0.3)';
            }

            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function openContactModal() {
            const bodyHtml = `
                <div class="contact-container">
                    <a href="https://www.instagram.com/mogue_2026/" target="_blank" class="contact-item contact-item-ig">
                        <div class="contact-icon-wrapper">
                            <img src="社群圖示/Instagram.png" class="contact-icon" alt="Instagram">
                        </div>
                        <div class="contact-info">
                            <span class="contact-label">Instagram</span>
                            <span class="contact-value">@mogue_2026</span>
                        </div>
                        <div class="contact-arrow">→</div>
                    </a>
                    <a href="mailto:mogue.sales@gmail.com" class="contact-item contact-item-email" onclick="handleGmailClick(event, this)">
                        <div class="contact-icon-wrapper">
                            <img src="社群圖示/Gmail.png" class="contact-icon" alt="Gmail">
                        </div>
                        <div class="contact-info">
                            <span class="contact-label">Gmail</span>
                            <span class="contact-value">mogue.sales@gmail.com</span>
                        </div>
                        <div class="contact-arrow">→</div>
                    </a>
                    <a href="javascript:void(0)" class="contact-item contact-item-yt" onclick="handleYtClick(event, this)">
                        <div class="contact-icon-wrapper">
                            <img src="社群圖示/youtube.png" class="contact-icon" alt="YouTube">
                        </div>
                        <div class="contact-info">
                            <span class="contact-label">YouTube</span>
                            <span class="contact-value">墨古</span>
                        </div>
                        <div class="contact-arrow">→</div>
                    </a>
                </div>
            `;
            openModal('聯絡與追蹤 | MOGUE Connect', bodyHtml, '#e0e0e0');
        }

        function handleGmailClick(event, element) {
            event.preventDefault();
            const email = 'mogue.sales@gmail.com';

            // Detect if the user is on a mobile device or tablet
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            // 1. Trigger the appropriate redirection synchronously as a direct user gesture
            if (isMobile) {
                // Mobile: Open default mail app via mailto
                window.location.href = 'mailto:' + email;
            } else {
                // Desktop: Open Gmail webmail composer in a new tab
                window.open('https://mail.google.com/mail/?view=cm&fs=1&to=' + email, '_blank');
            }

            function showFeedback() {
                const valueSpan = element.querySelector('.contact-value');
                const originalText = valueSpan.textContent;
                valueSpan.textContent = '已複製信箱，開啟信箱中... ✉️';
                setTimeout(() => {
                    valueSpan.textContent = originalText;
                }, 1800);
            }

            // 2. Perform the clipboard copying asynchronously
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(email)
                    .then(() => {
                        showFeedback();
                    })
                    .catch(err => {
                        console.error('Clipboard copy failed: ', err);
                    });
            } else {
                // Fallback copy using textarea
                try {
                    const textArea = document.createElement('textarea');
                    textArea.value = email;
                    textArea.style.position = 'fixed';
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    const successful = document.execCommand('copy');
                    document.body.removeChild(textArea);
                    if (successful) {
                        showFeedback();
                    }
                } catch (err) {
                    console.error('Fallback copy failed: ', err);
                }
            }
        }

        function handleYtClick(event, element) {
            event.preventDefault();
            if (element.classList.contains('under-construction')) return;

            element.classList.add('under-construction');
            const valueSpan = element.querySelector('.contact-value');
            const originalText = valueSpan.textContent;
            valueSpan.textContent = '施工中... 🛠️';

            setTimeout(() => {
                element.classList.remove('under-construction');
                valueSpan.textContent = originalText;
            }, 1200);
        }

        // Enable drag-to-scroll on desktop for modalBody
        const modalBody = document.getElementById('modalBody');
        let isDown = false;
        let startY;
        let scrollTop;

        modalBody.addEventListener('mousedown', (e) => {
            isDown = true;
            modalBody.style.cursor = 'grabbing';
            startY = e.pageY - modalBody.offsetTop;
            scrollTop = modalBody.scrollTop;
        });

        modalBody.addEventListener('mouseleave', () => {
            isDown = false;
            modalBody.style.cursor = 'grab';
        });

        modalBody.addEventListener('mouseup', () => {
            isDown = false;
            modalBody.style.cursor = 'grab';
        });

        modalBody.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const y = e.pageY - modalBody.offsetTop;
            const walk = (y - startY) * 1.5; // Scroll speed multiplier
            modalBody.scrollTop = scrollTop - walk;
        });

        // Toggle 3D card flip for Hotspot 2 every 5 seconds
        setInterval(() => {
            const cards = document.querySelectorAll('.card-container');
            cards.forEach(card => {
                card.classList.toggle('is-flipped');
            });
            const stars = document.querySelectorAll('.gemini-star');
            stars.forEach(star => {
                // Re-trigger the CSS keyframe animation by removing class, forcing reflow, and re-adding class
                star.classList.remove('is-orbiting');
                void star.offsetWidth; // Trigger reflow
                star.classList.add('is-orbiting');
            });
        }, 5000);
    </script>

</body>
